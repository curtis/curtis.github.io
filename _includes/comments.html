{% if layout.comments %}
  <hr />

  <div id="disqus_thread"></div>

  <script type="text/javascript">
    // Load Disqus only when the comments are about to scroll into view
    (function() {
      var d = document, thread = d.getElementById('disqus_thread');
      function loadDisqus() {
        var s = d.createElement('script');
        s.src = 'https://millarian.disqus.com/embed.js';
        s.setAttribute('data-timestamp', +new Date());
        (d.head || d.body).appendChild(s);
      }
      if (!('IntersectionObserver' in window)) return loadDisqus();
      var observer = new IntersectionObserver(function(entries) {
        if (!entries[0].isIntersecting) return;
        observer.disconnect();
        loadDisqus();
      }, { rootMargin: '600px' });
      observer.observe(thread);
    })();
  </script>

  <noscript>
    Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a>
  </noscript>
{% endif %}
